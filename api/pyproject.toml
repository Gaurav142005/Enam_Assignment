[project]
name = "finn-api"
version = "0.1.0"
description = "FINN backend: Push digest, Pull research, Network intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.28.1",
    "yfinance>=1.8.0",
    "selectolax>=1.0.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "I"]
ignore = ["E501", "E731", "E741", "B008", "B905", "SIM102", "SIM105", "SIM108", "SIM118", "UP017"]
