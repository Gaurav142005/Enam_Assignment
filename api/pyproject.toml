[project]
name = "finn-api"
version = "0.1.0"
description = "FINN backend: Push digest, Pull research, Network intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.28.1",
    "yfinance>=1.8.0",
    "selectolax>=1.0.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
